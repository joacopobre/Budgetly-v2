  <script>
    (function () {
      var K = window.Kit;
      var DUR = 10.4;
      var whole = function (v) { return K.money(v, { decimals: "never" }); };

      function build() {
        var cam = document.getElementById("dash-cam");
        var cursor = "#dash-cursor";
        var rangeBox = K.box("#dash-range", cam);
        var menu = document.getElementById("dash-menu");
        menu.style.left = rangeBox.x + rangeBox.w - 260 + "px";
        menu.style.top = rangeBox.y + rangeBox.h + 8 + "px";
        var range = K.point("#dash-range", cam, 0.5, 0.55);
        var optY = K.point("#dash-opt-y", cam, 0.4, 0.55);
        var optM = K.point("#dash-opt-m", cam, 0.4, 0.55);

        var tl = gsap.timeline({ paused: true });
        K.open(tl, cam);
        K.hidden(["#dash-menu", "#dash-hover-m", "#dash-hover-y"]);
        gsap.set(".dash-y-bar", { scaleY: 0 });
        gsap.set(".dash-y-lab", { opacity: 0 });
        gsap.set("#dash-line-y", { strokeDashoffset: 1, opacity: 0 });
        gsap.set("#dash-line-m", { strokeDashoffset: 0 });
        K.cursorSet(cursor, { x: 900, y: 640 });

        function switchTo(year, at) {
          var from = year ? ".dash-m-bar" : ".dash-y-bar";
          var to = year ? ".dash-y-bar" : ".dash-m-bar";
          tl.to(from, { scaleY: 0, duration: 0.32, ease: "power2.in", stagger: 0.012 }, at);
          tl.to(year ? ".dash-m-lab" : ".dash-y-lab", { opacity: 0, duration: 0.2, ease: "power2.in" }, at);
          tl.to(year ? ".dash-y-lab" : ".dash-m-lab", { opacity: 1, duration: 0.4, ease: "power2.out" }, at + 0.35);
          tl.to(to, { scaleY: 1, duration: 0.9, ease: "expo.out", stagger: year ? 0.022 : 0.05 }, at + 0.3);
          K.count(tl, "#dash-inc", year ? 4355 : 46120, year ? 46120 : 4355, at + 0.1, 1.2, whole);
          K.count(tl, "#dash-out", year ? 1304 : 28564, year ? 28564 : 1304, at + 0.1, 1.2, whole);
          K.count(tl, "#dash-net", year ? 3051 : 17556, year ? 17556 : 3051, at + 0.1, 1.2, whole);
          K.swapText(tl, "#dash-inc-sub", year ? "This month" : "This year", year ? "This year" : "This month", at + 0.1);
          K.swapText(tl, "#dash-out-sub", year ? "This month" : "This year", year ? "This year" : "This month", at + 0.1);
          K.swapText(tl, "#dash-net-sub", year ? "70% of income" : "38% of income", year ? "38% of income" : "70% of income", at + 0.1);
          K.swapText(tl, "#dash-nw-chip", year ? "+£1,156" : "+£7,756", year ? "+£7,756" : "+£1,156", at + 0.1);
          K.swapText(tl, "#dash-range-label", year ? "This month" : "This year", year ? "This year" : "This month", at);
          var a = year ? "#dash-line-m" : "#dash-line-y";
          var b = year ? "#dash-line-y" : "#dash-line-m";
          tl.to(a, { opacity: 0, duration: 0.25, ease: "power2.in" }, at);
          tl.set(a, { strokeDashoffset: 1 }, at + 0.26);
          tl.set(b, { opacity: 1 }, at + 0.26);
          tl.to(b, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, at + 0.28);
        }

        function choose(option, hover, at) {
          K.cursorTo(tl, cursor, range, at, 0.7);
          K.press(tl, cursor, "#dash-range", at + 0.78);
          K.show(tl, "#dash-menu", at + 0.88, { scale: 0.95, y: -6, dur: 0.26 });
          K.cursorTo(tl, cursor, option, at + 1.2, 0.36);
          K.fade(tl, hover, 0, 1, at + 1.38, 0.12);
          K.press(tl, cursor, null, at + 1.72);
          K.hide(tl, "#dash-menu", at + 1.82, { y: -4 });
          tl.to(hover, { opacity: 0, duration: 0.1 }, at + 2.0);
          return at + 1.84;
        }

        // 1. This month → This year
        var t = choose(optY, "#dash-hover-y", 0.6);
        switchTo(true, t);
        K.cursorTo(tl, cursor, { x: 760, y: 610 }, t + 0.2, 1.1);

        // 2. …and back, so the loop ends where it started
        t = choose(optM, "#dash-hover-m", 5.5);
        switchTo(false, t);
        K.cursorTo(tl, cursor, { x: 900, y: 640 }, t + 0.2, 1.1);

        K.close(tl, cam, DUR);
        tl.set({}, {}, DUR);
        window.__timelines["dashboard"] = tl;
      }

      if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
      else build();
    })();
  </script>
