  <script>
    (function () {
      var K = window.Kit;
      var DUR = 11.6;

      function build() {
        var cam = document.getElementById("cap-cam");
        var cursor = "#cap-cursor";
        function under(menuId, fieldId) {
          var b = K.box(fieldId, cam);
          var m = document.getElementById(menuId);
          m.style.left = b.x + "px";
          m.style.top = b.y + b.h + 8 + "px";
          m.style.width = b.w + "px";
        }
        under("cap-menu-cat", "#cap-f-cat");
        under("cap-menu-from", "#cap-f-from");

        var add = K.point("#cap-add", cam, 0.5, 0.55);
        var modal = K.point("#cap-modal", cam);
        var fCat = K.point("#cap-f-cat", cam, 0.6, 0.55);
        var optFood = K.point("#cap-opt-food", cam, 0.35, 0.55);
        var fAmt = K.point("#cap-f-amt", cam, 0.55, 0.55);
        var fFrom = K.point("#cap-f-from", cam, 0.6, 0.55);
        var optGroc = K.point("#cap-opt-groc", cam, 0.35, 0.55);
        var save = K.point("#cap-save", cam, 0.5, 0.55);

        var tl = gsap.timeline({ paused: true });
        K.open(tl, cam);
        K.hidden(["#cap-cat", "#cap-scrim", "#cap-modal", "#cap-menu-cat", "#cap-menu-from", "#cap-hover-food", "#cap-hover-groc", "#cap-ring-desc", "#cap-ring-cat", "#cap-ring-amt", "#cap-ring-from", "#cap-caret-desc", "#cap-caret-amt", "#cap-new", "#cap-new-wash"]);
        K.cursorSet(cursor, { x: 1080, y: 760 });

        // 1. Open the form
        K.cursorTo(tl, cursor, add, 0.5, 0.75);
        K.press(tl, cursor, "#cap-add", 1.32);
        K.fade(tl, "#cap-scrim", 0, 1, 1.46, 0.3);
        K.show(tl, "#cap-modal", 1.5, { dur: 0.4 });
        K.camTo(tl, cam, modal, 1.12, 1.5, 1.0);

        // 2. Description
        K.focus(tl, "#cap-ring-desc", 1.85);
        K.caret(tl, "#cap-caret-desc", 1.9, 3.7);
        K.type(tl, "#cap-desc", "Coffee", 2.25, { cps: 8.5 });

        // 3. Category
        K.cursorTo(tl, cursor, fCat, 3.05, 0.55);
        K.press(tl, cursor, null, 3.66);
        K.blur(tl, "#cap-ring-desc", 3.7);
        K.focus(tl, "#cap-ring-cat", 3.7);
        K.show(tl, "#cap-menu-cat", 3.76, { scale: 0.96, y: -6, dur: 0.26 });
        K.cursorTo(tl, cursor, optFood, 4.05, 0.32);
        K.fade(tl, "#cap-hover-food", 0, 1, 4.2, 0.12);
        K.press(tl, cursor, null, 4.5);
        K.hide(tl, "#cap-menu-cat", 4.6, { y: -4 });
        tl.to("#cap-cat-ph", { opacity: 0, duration: 0.08 }, 4.6);
        tl.fromTo("#cap-cat", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 4.6);

        // 4. Amount
        K.cursorTo(tl, cursor, fAmt, 4.78, 0.45);
        K.press(tl, cursor, null, 5.26);
        K.blur(tl, "#cap-ring-cat", 5.3);
        K.focus(tl, "#cap-ring-amt", 5.3);
        K.caret(tl, "#cap-caret-amt", 5.35, 6.85);
        K.type(tl, "#cap-amt", "3.40", 5.6, { cps: 6.5 });

        // 5. Which budget pays
        K.cursorTo(tl, cursor, fFrom, 6.4, 0.45);
        K.press(tl, cursor, null, 6.88);
        K.blur(tl, "#cap-ring-amt", 6.92);
        K.focus(tl, "#cap-ring-from", 6.92);
        K.show(tl, "#cap-menu-from", 6.98, { scale: 0.96, y: -6, dur: 0.26 });
        K.cursorTo(tl, cursor, optGroc, 7.26, 0.3);
        K.fade(tl, "#cap-hover-groc", 0, 1, 7.4, 0.12);
        K.press(tl, cursor, null, 7.68);
        K.hide(tl, "#cap-menu-from", 7.78, { y: -4 });
        K.swapText(tl, "#cap-from", "Account", "Groceries", 7.78);
        K.blur(tl, "#cap-ring-from", 7.9);

        // 6. Save: the row lands at the top
        K.cursorTo(tl, cursor, save, 7.95, 0.5);
        K.press(tl, cursor, "#cap-save", 8.5);
        K.hide(tl, "#cap-modal", 8.62);
        tl.to("#cap-scrim", { opacity: 0, duration: 0.3, ease: "power2.out" }, 8.62);
        K.camReset(tl, cam, 8.64, 0.9);
        tl.fromTo("#cap-rows", { y: 0 }, { y: 68, duration: 0.6, ease: "expo.out" }, 9.05);
        tl.fromTo("#cap-new", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 9.12);
        tl.fromTo("#cap-new-wash", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 9.12);
        tl.to("#cap-new-wash", { opacity: 0, duration: 1.5, ease: "power2.inOut" }, 9.7);
        K.cursorTo(tl, cursor, { x: 1120, y: 640 }, 8.9, 1.0);

        K.close(tl, cam, DUR);
        tl.set({}, {}, DUR);
        window.__timelines["capture"] = tl;
      }

      if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
      else build();
    })();
  </script>
