  <script>
    (function () {
      var K = window.Kit;
      var DUR = 11.8;

      function build() {
        var cam = document.getElementById("imp-cam");
        var cursor = "#imp-cursor";
        var open = K.point("#imp-open", cam, 0.5, 0.55);
        var modal = K.point("#imp-modal", cam);
        var drop = K.point("#imp-drop", cam, 0.5, 0.5);
        var next = K.point("#imp-next", cam, 0.5, 0.55);
        var pick = { x: 1330, y: 880 };
        var fileW = document.getElementById("imp-file").offsetWidth;
        // The file hangs just below the arrow, as if held.
        function filePos(pt) {
          return { x: pt.x - fileW * 0.35, y: pt.y + 10 };
        }

        var tl = gsap.timeline({ paused: true });
        K.open(tl, cam);
        K.hidden(["#imp-scrim", "#imp-modal", "#imp-file", "#imp-drop-on", "#imp-p2", "#imp-p3", "#imp-t1", "#imp-t2", "#imp-t3", "#imp-new-0", "#imp-new-1", "#imp-new-2", "#imp-new-3"]);
        gsap.set(["#imp-s2", "#imp-s3"], { scaleX: 0 });
        gsap.set("#imp-file", filePos(pick));
        K.cursorSet(cursor, { x: 1060, y: 720 });
        K.bar(tl, "#imp-fill", 0, 0, 0, 0.01);

        // 1. Open the importer
        K.cursorTo(tl, cursor, open, 0.5, 0.75);
        K.press(tl, cursor, "#imp-open", 1.32);
        K.fade(tl, "#imp-scrim", 0, 1, 1.46, 0.3);
        K.show(tl, "#imp-modal", 1.5, { dur: 0.4 });
        K.camTo(tl, cam, modal, 1.1, 1.5, 1.0);

        // 2. Fetch the file and drop it in
        K.cursorTo(tl, cursor, pick, 2.0, 0.6);
        tl.fromTo("#imp-file", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 2.55);
        K.press(tl, cursor, null, 2.6);
        K.cursorTo(tl, cursor, drop, 2.95, 0.85);
        var fp = filePos(drop);
        tl.to("#imp-file", { x: fp.x, duration: 0.85, ease: "power2.inOut" }, 2.95);
        tl.to("#imp-file", { y: fp.y, duration: 0.85, ease: "power3.inOut" }, 2.95);
        K.fade(tl, "#imp-drop-on", 0, 1, 3.45, 0.2);
        tl.to("#imp-file", { scale: 0.94, duration: 0.1, ease: "power2.in" }, 3.9);
        tl.to("#imp-file", { opacity: 0, scale: 0.86, duration: 0.2, ease: "power2.in" }, 4.0);

        // 3. Columns match themselves
        tl.to("#imp-p1", { opacity: 0, duration: 0.18, ease: "power2.in" }, 4.1);
        K.fade(tl, "#imp-p2", 0, 1, 4.26, 0.3);
        tl.to("#imp-s2", { scaleX: 1, duration: 0.5, ease: "expo.out" }, 4.26);
        K.swapText(tl, "#imp-sub", "Upload a CSV file from your bank.", "Match your columns to Budgetly's fields.", 4.26);
        ["#imp-t1", "#imp-t2", "#imp-t3"].forEach(function (id, i) {
          tl.fromTo(id, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 4.6 + i * 0.26);
        });
        K.cursorTo(tl, cursor, next, 4.7, 0.7);
        K.press(tl, cursor, "#imp-next", 5.7);

        // 4. Review, then import
        tl.to("#imp-p2", { opacity: 0, duration: 0.18, ease: "power2.in" }, 5.82);
        K.fade(tl, "#imp-p3", 0, 1, 5.98, 0.3);
        tl.to("#imp-s3", { scaleX: 1, duration: 0.5, ease: "expo.out" }, 5.98);
        K.swapText(tl, "#imp-sub", "Match your columns to Budgetly's fields.", "Check the rows before anything is saved.", 5.98);
        K.swapText(tl, "#imp-next-label", "Continue", "Import 42", 5.98);
        K.press(tl, cursor, "#imp-next", 6.95);
        K.bar(tl, "#imp-fill", 0, 1, 7.08, 0.95);
        K.count(tl, "#imp-prog", 0, 42, 7.08, 0.95, function (v) { return String(Math.round(v)); });

        // 5. The table fills
        K.hide(tl, "#imp-modal", 8.25);
        tl.to("#imp-scrim", { opacity: 0, duration: 0.3, ease: "power2.out" }, 8.25);
        K.camReset(tl, cam, 8.27, 0.9);
        tl.fromTo("#imp-rows", { y: 0 }, { y: 272, duration: 0.7, ease: "expo.out" }, 8.6);
        ["#imp-new-0", "#imp-new-1", "#imp-new-2", "#imp-new-3"].forEach(function (id, i) {
          tl.fromTo(id, { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 8.68 + (3 - i) * 0.08);
        });
        K.swapText(tl, "#imp-count", "SHOWING 1–3 OF 3 TRANSACTIONS", "SHOWING 1–7 OF 45 TRANSACTIONS", 8.7);
        K.cursorTo(tl, cursor, { x: 1130, y: 700 }, 8.5, 1.0);

        K.close(tl, cam, DUR);
        tl.set({}, {}, DUR);
        window.__timelines["import"] = tl;
      }

      if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
      else build();
    })();
  </script>
